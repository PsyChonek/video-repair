name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false # never kill a deploy mid-flight

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5

      - name: Verify the site answers
        env:
          URL: ${{ steps.pages.outputs.page_url }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$URL" | grep -q 'id="drop"'; then echo "live: $URL"; exit 0; fi
            sleep 5
          done
          echo "site did not come up at $URL" >&2
          exit 1
