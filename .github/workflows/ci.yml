name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Public repo: GitHub-hosted only. A self-hosted runner here would run
    # code from any fork's pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # A malformed workflow produces a run with no jobs; catch it on the PR.
      # Pinned by digest (1.7.12) and mounted read-only: the image cannot change
      # under us or write into the checkout.
      - name: Lint workflows
        run: docker run --rm -v "$PWD":/repo:ro -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - run: npm run check
      - run: npm run build
